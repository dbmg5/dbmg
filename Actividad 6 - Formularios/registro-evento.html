<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Participantes</title>
</head>
<body>

    <header>
        <h1>Registro de Participantes</h1>
        <h2>Evento Universitario </h2>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>

                <legend>Información Personal</legend>

                <p>

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
                
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                </p>

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="18" max="100" required>

                <label for="fecha">Fecha de nacimiento:</label>
                <input type="date" id="fecha" name="fecha" required>


                <p></p>

                <fieldset>

                <p></p>

                <legend>Universidad</legend>

                <label for="carrera">Carrera universitaria:</label>
                <select id="carrera" name="carrera" required>
                    <option value="">Seleccionar...</option>
                    <option value="ingenieria">Ingeniería</option>
                    <option value="medicina">Medicina</option>
                    <option value="derecho">Derecho</option>
                    <option value="administracion">Administración de Empresas</option>
                </select>

                <p>Turno de asistencia:</p>

                <input type="radio" id="turno-manana" name="turno" value="mañana" required>
                <label for="turno-manana">Mañana</label>

                <input type="radio" id="turno-tarde" name="turno" value="tarde">
                <label for="turno-tarde">Tarde</label>

                </p>

            </fieldset>



            </fieldset>

            <fieldset>
                <legend>Términos y Condiciones</legend>
                <p>
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos y condiciones</label>
                </p>
            </fieldset>

            <p>
                    <button type="submit">Registrar</button>
                    <button type="reset">Limpiar formulario</button>
            </p>

        </form>
    </main>

        <footer>
        <p>Formulario de registro - Solo vista previa, sin almacenamiento de datos.</p>
    </footer>




</body>
</html>
